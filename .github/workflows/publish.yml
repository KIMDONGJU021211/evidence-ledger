# Publishes to PyPI when a v* tag is pushed.
#
# No API token lives anywhere. PyPI is told, once, that this repository and
# this workflow file are allowed to publish this project (Trusted Publishing,
# OIDC). Nothing to store, nothing to leak, nothing to rotate.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # the OIDC token PyPI verifies. Nothing else is needed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
